# used to create the object
name: AllegroArmMOAR

physics_engine: ${..physics_engine}

# if given, will override the device setting in gym.
env:
  objectSize: large # medium, small
  pc_ablation: False
  legacy_obs: True
  pc_mode: label
  # CRITICAL: must NOT be "multi-modality" or "no-tactile" for this touch-only
  # (partial_stack) task. vec_task.py's step()/reset()/reset_done() strip the
  # 16-dim tactile block out of every one of the 4 stacked observation frames
  # whenever ablation_mode is "no-tactile" or "multi-modality" (and the task
  # file's numObservations override to a hardcoded 276 matches that stripped
  # size exactly) - i.e. those two values silently blind the policy to touch,
  # which defeats the entire point of this "Rotating without Seeing"
  # reproduction. "no-pc" (or "aug"/"cam") avoids both the stripping and the
  # numObservations override; "no-pc" is semantically accurate here since
  # there is no point-cloud/vision modality in this task at all.
  ablation_mode: no-pc # aug, no-pc, cam, no-tactile -- NOT multi-modality/no-tactile, see comment above
  is_distillation: False  # for teacher policy
  observation:
    obs:
    pointcloud:
      bound: [0.5, 10, -1, 1, 0.12, 0.8]  
      numSample: 808  

  camera:
    pos: [0.45252319, 0.33285737, 0.5127288]  
    rot: [-0.6354564, 44.3181397, -70.6868244]  
    width: 96
    height: 72
    fov: 69.4  # horizontal fov of RealSense D435, color channel. depth fov is larger so we take the smaller one

  rewardType: "finger"
  sensor: "thick"
  objInit: "new"
  objSet: "set16"
  pc_category: "mug"
  skill_step: 500
  spin_coef: 1.0
  main_coef: 0.0
  aux_coef: 0.0
  vel_coef: -0.1
  contact_coef: 0.0
  torque_coef: -0.0003
  work_coef: -0.0003
  finger_coef: 0.1
  handInit: "default"
  numEnvs: ${resolve_default:8192,${...num_envs}}
  envSpacing: 0.75
  episodeLength: 500
  enableDebugVis: False
  # True: object assignment is round-robin (env i -> object i % N) instead of random -- used for
  # balanced data collection / visualization. Does not affect the actor's observations (object
  # identity is never in last_obs_buf), only which physical object each env slot gets.
  deterministicObjectAssign: False
  aggregateMode: 1
  # Contact sensor detection threshold, randomized per-episode in [sensorThreshLow, sensorThreshLow+sensorThresh] N.
  # Paper (Rotating without Seeing) uses a fixed 0.01N; here we keep a small randomized band centered on it.
  sensorThreshLow: 0.005
  sensorThresh: 0.01
  sensorNoise: 0.1
  obs_stack: 4
  latency: 0.25
  m_low: 0.2
  m_up: 0.6
  # When True, the object's initial yaw (rotation about the up/z axis) is
  # randomized uniformly in [-pi, pi] at every reset instead of always
  # starting at the URDF's fixed default orientation.
  useInitRandomRotation: True
  # Object/hand friction randomization range (paper: [0.3, 3.0] for both, sampled independently)
  objectFrictionLow: 0.3
  objectFrictionHigh: 3.0
  handFrictionLow: 0.3
  handFrictionHigh: 3.0
  # Object scale randomization range for the default ("set16") object set (paper: U(0.95, 1.05))
  objectScaleLow: 0.95
  objectScaleHigh: 1.05
  # PD gain randomization multipliers (paper: P x U(0.66, 1.33), D x U(0.80, 1.20))
  pGainMultLow: 0.66
  pGainMultHigh: 1.33
  dGainMultLow: 0.80
  dGainMultHigh: 1.20
  # Joint-position observation noise half-width (paper: U(-0.05, 0.05))
  jointObsNoise: 0.05
  # Torque reward norm: "l2" (paper, -||tau||) or "l2sq" (-||tau||^2)
  torqueRewardNorm: "l2"
  # Use the per-env log-uniform forceProbRange to gate random-force application instead of a flat scalar
  useForceProbRange: True

  # Progressive domain randomization -- see allegro_arm_morb_axis.py's
  # _dr_ramp_frac()/_apply_dr_ramp(). Enabled by default for the 16-object
  # ("set16") training run: every DR range/magnitude above (friction, mass,
  # PD gain multipliers, sensor threshold/noise/lag, joint obs noise, reset
  # position noise, random force scale/probability) starts shrunk toward "no
  # randomization" at drRampStartFrac and linearly widens back out to the
  # values configured above over drRampSteps control steps (pre_physics_step
  # calls, i.e. env.step() calls -- NOT PPO epochs; cfg/train's
  # horizon_length=16 steps/epoch x max_epochs=20100 = 321,600 total steps
  # for the full paper-spec run, so 50000 ramps DR up over roughly the first
  # ~15% of training). Object scale is not covered (it's baked in at env
  # creation, before any ramp has run). Set to False to fully restore the
  # old always-on-full-DR behavior.
  drRampEnable: True
  drRampStartFrac: 0.0
  drRampSteps: 50000

  force_debug: False
  numTestEnvs: 16
  test:
    test_m_low: 0.1
    test_m_up: 1.4

  robotStiffness: 3.0
  clipObservations: 5.0
  clipActions: 1.0

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  relScale: 0.2 # relative motion scale
  useRelativeControl: True
  usePrevTarget: False
  dofSpeedScale: 20.0
  actionsMovingAverage: 0.8
  controlFrequencyInv: 6 # 10 Hz

  startPositionNoise: 0.01 
  startRotationNoise: 0.0

  resetPositionNoise: 0.015
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.2
  resetDofVelRandomInterval: 0.0

  # Random forces applied to the object
  forceScale: 0.2
  forceProbRange: [0.2, 0.25]
  forceProbScalar: 0.25
  forceDecay: 0.99
  forceDecayInterval: 0.10
  disableSet: 0

  # reward -> dictionary
  axis: "z"
  distRewardScale: -3.0
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: 0.0
  controlPenaltyScale: 0.0
  reachGoalBonus: 250
  fallDistance: 0.10
  fallPenalty: -50.0

  objectType: "block"
  observationType: "partial_stack"
  asymmetric_observations: True
  successTolerance: 0.1
  printNumSuccesses: False
  maxConsecutiveSuccesses: 0

  # Note: assetFileName/Block/Egg/Pen below are legacy keys not actually read by
  # allegro_arm_morb_axis.py (only asset.assetRoot is read there). The hand/object
  # URDFs actually used are selected via robot_asset_files_dict["thick"] and
  # object_sets[objSet] in the task code itself. Kept here (pointed at real files in
  # this pruned repo) only for documentation purposes.
  asset:
    assetFileName: "urdf/xarm6/xarm6_allegro_right_fsr_2023_thin.urdf"

task:
  randomize: True
  randomization_params:
    frequency: 1000   # Define how many simulation steps between generating new randomizations
    observations:
      range: [0, .05]  # range for the white noise
      range_correlated: [0, .001 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
    actions:
      # Paper (Rotating without Seeing): action noise +-U(0.06)
      range: [-0.06, .06]
      range_correlated: [0, .015] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "uniform"
    sim_params:
      gravity:
        range: [0, 0.3]
        operation: "additive"
        distribution: "gaussian"
    actor_params:
      hand:
        color: False
        dof_properties:
          stiffness:
            range: [0.75, 1.5]
            operation: "scaling"
            distribution: "loguniform"
          lower:
            range: [0, 0.00001]
            operation: "additive"
            distribution: "gaussian"
          upper:
            range: [0, 0.00001]
            operation: "additive"
            distribution: "gaussian"

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: 0.01667 
  substeps: 2 
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 2 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (default - all contacts)
